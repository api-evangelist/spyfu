description: >-
  SpyFu ships NO first-party client library for the SpyFu API in any language.
  The developer portal, the llms.txt index and the first-party
  github.com/spyfu/spyfu_api_docs repository all document raw HTTP only —
  Basic auth, an api_key query parameter, or an HMAC header — with no SDK,
  wrapper, or generated client offered. Searched npm, PyPI, RubyGems,
  Packagist, crates.io, Maven Central and pkg.go.dev: no first-party API client
  exists on any of them. The packages SpyFu does publish under its own npm
  scope and GitHub org are internal Vue/Vuex front-end utilities for the SpyFu
  web app, unrelated to the API, and every one of them last shipped between
  2017 and 2020.
