  - api: Ranking History API
    service: organic_history_api
    uniform: 10
    endpoints:
      - {path: /organic_history_api/v2/historic/getHistoricRankingsForDomain, operationId: HistoricRanking_GetHistoricRankingsForDomain_GET, limit: 10, unit: requests/second}
      - {path: /organic_history_api/v2/historic/getHistoricRankingsForKeywordOnDomains, operationId: HistoricRanking_GetHistoricRankingsForKeywordOnDomains_GET, limit: 10, unit: requests/second}
      - {path: /organic_history_api/v2/historic/getHistoricRankingsForDomainOnKeywords, operationId: HistoricRanking_GetHistoricRankingsForDomainOnKeywords_GET, limit: 10, unit: requests/second}
  - api: Account API
    service: accounts_api
    endpoints: []
    note: SpyFu publishes no rate limit for the Account API usage endpoints.
bestPractices:
  - Back off on 429 for the number of seconds in Retry-After (typically 1).
  - Batch or paginate where supported to reduce total call volume.
  - Cache responses; the underlying data updates monthly for most endpoints.
  - Cap concurrency per endpoint — there are no headers to react to, so limits must be respected proactively.
  - Monitor usage at https://www.spyfu.com/account/api and via the Account API.
