      - {path: /keyword_api/v2/related/getKeywordInformation, operationId: RelatedKeywordsV2Api_GetKeywordsByBulkSearch_GET, method: GET, limit: 100, unit: requests/second}
      - {path: /keyword_api/v2/related/getKeywordInformation, operationId: RelatedKeywordsV2Api_GetKeywordsByBulkSearchPost_POST, method: POST, limit: 10, unit: requests/second}
