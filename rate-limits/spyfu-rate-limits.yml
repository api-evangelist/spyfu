      - {path: /keyword_api/v2/kombat/getCompetingSeoKeywords, operationId: KombatApi_GetCompetingSeoKeywords_GET, limit: 8, unit: requests/second}
  - api: Keyword Research API
    service: keyword_api
    endpoints:
      - {path: /keyword_api/v2/related/getRelatedKeywords, operationId: RelatedKeywordsV2Api_GetRelatedKeywords_GET, limit: 5, unit: requests/second}
      - {path: /keyword_api/v2/related/getQuestionKeywords, operationId: RelatedKeywordsV2Api_GetQuestionKeywords_GET, limit: 10, unit: requests/second}
      - {path: /keyword_api/v2/related/getAlsoBuysAdsForKeywords, operationId: RelatedKeywordsV2Api_GetAlsoBuysAdsForKeywords_GET, limit: 10, unit: requests/second}
      - {path: /keyword_api/v2/related/getAlsoRanksForKeywords, operationId: RelatedKeywordsV2Api_GetAlsoRanksForKeywords_GET, limit: 10, unit: requests/second}
