      - {path: /serp_api/v2/seo/getMostValuableKeywords, operationId: OrganicSerpApi_GetMostValuableKeywords_GET, limit: 10, unit: requests/second}
      - {path: /serp_api/v2/seo/getNewlyRankedKeywords, operationId: OrganicSerpApi_GetNewlyRankedKeywords_GET, limit: 10, unit: requests/second}
      - {path: /serp_api/v2/seo/getGainedRanksKeywords, operationId: OrganicSerpApi_GetGainedRanksKeywords_GET, limit: 10, unit: requests/second}
      - {path: /serp_api/v2/seo/getLostRanksKeywords, operationId: OrganicSerpApi_GetLostRanksKeywords_GET, limit: 10, unit: requests/second}
      - {path: /serp_api/v2/seo/getGainedClicksKeywords, operationId: OrganicSerpApi_GetGainedClicksKeywords_GET, limit: 10, unit: requests/second}
      - {path: /serp_api/v2/seo/getLostClicksKeywords, operationId: OrganicSerpApi_GetLostClicksKeywords_GET, limit: 10, unit: requests/second}
      - {path: /serp_api/v2/seo/getJustMadeItKeywords, operationId: OrganicSerpApi_GetJustMadeItKeywords_GET, limit: 10, unit: requests/second}
      - {path: /serp_api/v2/seo/getJustFellOffKeywords, operationId: OrganicSerpApi_GetJustFellOffKeywords_GET, limit: 10, unit: requests/second}
      - {path: /serp_api/v2/seo/getSerpAnalysisKeywords, operationId: OrganicSerpApi_GetSerpAnalysisKeywords_GET, limit: 10, unit: requests/second}
      - {path: /serp_api/v2/seo/getWhereTheyOutRankYou, operationId: OrganicSerpApi_GetKeywordsWhereTheyOutRankYou_GET, limit: 10, unit: requests/second}
      - {path: /serp_api/v2/seo/getWhereTheyJustSurpassedYou, operationId: OrganicSerpApi_GetKeywordsWhereTheyJustSurpassedYou_GET, limit: 10, unit: requests/second}
      - {path: /serp_api/v2/seo/getLiveSeoStats, operationId: OrganicSerpApi_GetLiveSeoStats_GET, limit: 10, unit: requests/second}
      - {path: /serp_api/v2/seo/getOrganicOutrankingKeywords, operationId: OrganicSerpApi_GetOrganicOutrankingKeywords_GET, limit: 10, unit: requests/second}
      - {path: /serp_api/v2/seo/getMostTrafficTopPages, operationId: TopPagesApi_GetMostTrafficTopPages_GET, limit: 10, unit: requests/second}
