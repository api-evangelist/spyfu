name: SpyFu API Rate Limits
description: >-
  SpyFu enforces per-endpoint rate limits on a rolling 1-second window. Limits
  vary by endpoint according to relative compute cost, from 2 requests/second on
  the Top Pages endpoints to 1000 requests/second on Domain Stats and
  Competitors. Exceeding a limit returns HTTP 429 Too Many Requests with a
  Retry-After header (typically 1) and a JSON body of
  {"error":"rate_limited","message":"Too many requests. Please retry after 1
  second."}. There are no RateLimit-* / X-RateLimit-* quota headers on
  successful responses, so a client cannot observe how close it is to a limit —
  the only runtime signal arrives after the limit is already breached. There are
  no daily or monthly request quotas; volume is metered commercially through the
  per-row API credit system instead (see finops/spyfu-finops.yml).
