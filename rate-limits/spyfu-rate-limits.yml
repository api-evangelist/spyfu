limit_count: 40
enforcement:
  window: rolling 1 second
  scope: per endpoint
  status_code: 429
  response_headers:
    - name: Retry-After
      value: "1"
      description: Seconds to wait before retrying. The only rate-limit header SpyFu returns.
  quota_headers: []
  error_body: '{"error": "rate_limited", "message": "Too many requests. Please retry after 1 second."}'
  retry_behavior: Wait the number of seconds in Retry-After, then retry. All operations are reads, so retry is always safe.
  increase_process: >-
    Contact SpyFu support with the API and endpoint, expected sustained RPS and
    burst behaviour, and the use case and time window.
limits:
  - api: Domain Stats API
    service: domain_stats_api
    endpoints:
      - {path: /domain_stats_api/v2/getAllDomainStats, operationId: DomainStatsApi_GetAllDomainStats_GET, limit: 1000, unit: requests/second}
      - {path: /domain_stats_api/v2/getLatestDomainStats, operationId: DomainStatsApi_GetLatestDomainStats_GET, limit: 1000, unit: requests/second}
      - {path: /domain_stats_api/v2/getDomainStatsForExactDate, operationId: DomainStatsApi_GetDomainStatsForExactDate_GET, limit: 1000, unit: requests/second}
      - {path: /domain_stats_api/v2/getActiveDatesForDomain, operationId: DomainStatsApi_GetActiveDatesForDomain_GET, limit: 1000, unit: requests/second}
      - {path: /domain_stats_api/v2/getBulkDomainStats, operationId: DomainStatsApi_GetBulkDomainStats_GET, limit: 333, unit: requests/second}
      - {path: /domain_stats_api/v2/getMatchingDomains, operationId: DomainStatsApi_GetMatchingDomains_GET, limit: 10, unit: requests/second}
  - api: Ad History API
    service: cloud_ad_history_api
    uniform: 10
    endpoints:
      - {path: /cloud_ad_history_api/v2/domain/getDomainAdHistory, operationId: AdHistoryApi_GetDomainAdHistory_GET, limit: 10, unit: requests/second}
      - {path: /cloud_ad_history_api/v2/domain/getDomainAdHistoryByDate, operationId: null, limit: 10, unit: requests/second, note: "Shipped 2026-07-15; documented upstream but not present in the OpenAPI captured in this repo."}
      - {path: /cloud_ad_history_api/v2/term/getTermAdHistory, operationId: AdHistoryApi_GetTermAdHistory_GET, limit: 10, unit: requests/second}
      - {path: /cloud_ad_history_api/v2/term/getTermAdHistoryWithStats, operationId: AdHistoryApi_GetTermAdHistoryWithStats_GET, limit: 10, unit: requests/second}
  - api: PPC Research API
    service: serp_api, keyword_api
    endpoints:
      - {path: /serp_api/v2/ppc/getPaidSerps, operationId: PaidSerpApi_GetPaidSerps_GET, limit: 12, unit: requests/second}
      - {path: /keyword_api/v2/ppc/getMostSuccessful, operationId: PaidSerpApi_GetMostSuccessful_GET, limit: 10, unit: requests/second}
      - {path: /keyword_api/v2/ppc/getNewKeywords, operationId: PaidSerpApi_GetNewKeywords_GET, limit: 10, unit: requests/second}
  - api: SEO Research API
