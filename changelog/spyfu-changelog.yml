    type: improvement
    breaking: false
    api_affected: SpyFu Custom GPT
    highlights:
      - >-
        Added a "Launch in ChatGPT" call-to-action inside the app for the SpyFu
        Custom GPT, the agent surface backed by the aggregated OpenAPI in
        github.com/spyfu/spyfu_api_docs/chatgpt/.
    issues: [SF-23576]
  - version:
    date: '2026-05-13'
    type: improvement
    breaking: false
    api_affected: API billing / account
    highlights:
      - >-
        Added a maximum API spending cap with alerts and an account-level record
        when the limit is reached, to prevent runaway pay-as-you-go charges.
    issues: [SF-23518]
  - version:
    date: '2026-05-06'
    type: improvement
    breaking: false
    api_affected: Account API / usage reporting
    highlights:
      - >-
        Added an API usage screen in the account and subscription area for
        per-endpoint consumption and cost tracking — the UI counterpart of the
        Account API usage endpoints.
    issues: [SF-23494]
  - version:
    date: '2026-04-15'
    type: improvement
    breaking: false
    api_affected: API billing
    highlights:
      - >-
        Clearer messaging about how bundled plan API credits work, plus an
        explicit disclosure that usage charges apply beyond the credit.
    issues: [SF-23493]
  - version:
    date: '2026-03-25'
    type: addition
    breaking: false
