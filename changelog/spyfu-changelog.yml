description: >-
  SpyFu publishes dated release notes as a single continuously-updated
  "What's New on SpyFu" article in its Intercom-hosted help centre, not as a
  developer-portal changelog. Entries are product-wide (web app, billing,
  account) with API changes mixed in; each bullet carries an internal Jira-style
  issue key (SF-*, BLOG-*). There is no per-API version history, no RSS/Atom
  feed, no API-only changelog view, and the developer portal's own /changelog
  path returns 404. Only entries with API relevance are structured below, from
  the most recent window.
