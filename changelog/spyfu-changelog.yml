    date: '2026-07-15'
    type: addition
    breaking: false
    api_affected: Ad History API
    highlights:
      - >-
        Added the getDomainAdHistoryByDate endpoint so a domain's ad URL history
        can be pulled across a specific date range (minSearchDateId /
        maxSearchDateId) with complete, consistent results, replacing the
        non-deterministic record sets the grouped endpoint returned.
    issues: [SF-23651]
