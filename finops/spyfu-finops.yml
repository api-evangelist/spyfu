      - {path: /organic_history_api/v2/historic/getHistoricRankingsForKeywordOnDomains, operationId: HistoricRanking_GetHistoricRankingsForKeywordOnDomains_GET, rowsReturned: Single/Multiple, cpm: 3.00}
      - {path: /organic_history_api/v2/historic/getHistoricRankingsForDomainOnKeywords, operationId: HistoricRanking_GetHistoricRankingsForDomainOnKeywords_GET, rowsReturned: Single/Multiple, cpm: 3.00}
  - api: Account API
    endpoints: []
    note: >-
      SpyFu publishes no CPM for the Account API usage endpoints. Whether
      reading your own usage is billable is undocumented.

cpmRange:
  min: 0.20
  max: 5.00
  cheapest: [getKeywordInformation, getTopCompetitors, getCombinedTopCompetitors]
  most_expensive: [getTopPages, getMostTrafficTopPages, getNewTopPages]

focusAlignment:
  chargeType: Usage
  serviceCategory: Analytics
  resourceType: API Rows
  usageUnit: Rows (per 1,000)
  provider: SpyFu

costOptimization:
  - strategy: Treat pageSize as a cost lever — it is the direct multiplier on every billed call.
  - strategy: Cache responses; most underlying data updates monthly, so repeat pulls buy nothing.
  - strategy: Call getActiveDatesForDomain before a full history pull, to avoid paying for an empty or short calendar.
  - strategy: Use getKeywordExpansions ($1.00) instead of looping getRelatedKeywords ($2.50) for the same expansion types.
  - strategy: Score shortlists with getKeywordInformation ($0.20), the cheapest endpoint in the API.
  - strategy: Use getCombinedTopCompetitors ($0.20) rather than separate PPC and SEO competitor calls.
  - strategy: Budget Ad History ($3.00) and Top Pages ($5.00) deliberately; they are 15x the cheapest endpoint.
  - strategy: Move to Team/Agency if monthly spend consistently exceeds the $40 Pro + AI credit.

monitoring:
  dashboard: https://www.spyfu.com/account/api
  api:
    - AccountApi_GetApiUsageForMonth_GET
    - AccountApi_GetApiUsageForMonthByDay_GET
    - AccountApi_GetApiUsageForMonthByMethod_GET
  runtime_headers: []
  runtime_header_note: >-
    No billing, quota or credit headers are returned on API responses. Spend is
    observable only by polling the Account API or the dashboard.
  alertRecommendation: Set the account spending cap, plus internal alerts at 75% and 90% of the monthly credit.

x-corrections:
  - >-
    Prior revision listed invented endpoint names (getDomainStatsForQuery,
    getAdHistoryForDomain, getPaidKeywords, getOrganicKeywords, getCompetitors,
    getDomainKombat, getRankingHistory) with CPMs that did not match SpyFu's
    published table — Ad History at $2.00 instead of $3.00, PPC at $1.00
    instead of $2.00, Ranking History at $1.00 instead of $3.00. Replaced with
    the full 47-row published pricing table, keyed to real paths and
    operationIds.
