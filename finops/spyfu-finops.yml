name: SpyFu API FinOps
description: >-
  FinOps Framework 1.0 FOCUS-aligned cost visibility profile for SpyFu API
  consumption. SpyFu uses a hybrid model: a flat monthly subscription includes a
  bundled API credit allowance, and everything beyond it is billed
  pay-as-you-go on a CPM basis per ROW of data returned — not per request. Every
  endpoint carries its own CPM, from $0.20 to $5.00, so the cost of a call is a
  function of the endpoint AND the pageSize the caller chose.
specificationVersion: "1.0"
generated: '2026-08-13'
method: searched
source: https://developer.spyfu.com/docs/api-pricing
source_mirror: https://github.com/spyfu/spyfu_api_docs/blob/v1.0/docs/documentation/api-pricing.md
url: https://developer.spyfu.com/docs/api-pricing

costModel:
  type: Hybrid (Subscription + Usage-Based Overage)
  billingGranularity: Per successful row of data returned
  formula: "(successful_rows / 1000) * endpoint_cpm"
  billingCycle: Monthly, 1st 00:00 UTC to last day 23:59 UTC
  currency: USD
  overage: Charged to the account payment method once the monthly credit is exhausted
  spendCap:
    available: true
    shipped: '2026-05-13'
    configured_in: https://www.spyfu.com/account/api
    api_configurable: false
    note: >-
      Account-level maximum API spend with alerts and an account record when the
      limit is reached. Configured in the UI only — there is no API to set it,
      so an agent cannot cap its own spend programmatically.

includedCredits:
  - plan: Basic
    monthlyCredit: 0.00
    apiAccess: false
  - plan: Pro + AI
    monthlyCredit: 40.00
    apiAccess: true
  - plan: Team / Agency
    monthlyCredit: 100.00
    apiAccess: true

rowsReturnedLegend:
  Single: Returns one result row by default.
  Multiple: Returns multiple rows by default unless only one is available.
  Single/Multiple: >-
    Returns a single row by default (one domain or keyword submitted); can be
    configured to submit several and receive multiple rows.
  "Single/Multiple*": Returns multiple rows by default but can be configured to return one.

endpointPricing:
  - api: Domain Stats API
    endpoints:
      - {path: /domain_stats_api/v2/getAllDomainStats, operationId: DomainStatsApi_GetAllDomainStats_GET, rowsReturned: Multiple, cpm: 0.50}
      - {path: /domain_stats_api/v2/getLatestDomainStats, operationId: DomainStatsApi_GetLatestDomainStats_GET, rowsReturned: "Single/Multiple*", cpm: 0.50}
      - {path: /domain_stats_api/v2/getDomainStatsForExactDate, operationId: DomainStatsApi_GetDomainStatsForExactDate_GET, rowsReturned: Single, cpm: 0.50}
      - {path: /domain_stats_api/v2/getActiveDatesForDomain, operationId: DomainStatsApi_GetActiveDatesForDomain_GET, rowsReturned: Multiple, cpm: 0.50}
      - {path: /domain_stats_api/v2/getBulkDomainStats, operationId: DomainStatsApi_GetBulkDomainStats_GET, rowsReturned: Single/Multiple, cpm: 0.40}
      - {path: /domain_stats_api/v2/getMatchingDomains, operationId: DomainStatsApi_GetMatchingDomains_GET, rowsReturned: Multiple, cpm: 1.00}
  - api: Ad History API
    endpoints:
      - {path: /cloud_ad_history_api/v2/domain/getDomainAdHistory, operationId: AdHistoryApi_GetDomainAdHistory_GET, rowsReturned: Multiple, cpm: 3.00}
      - {path: /cloud_ad_history_api/v2/domain/getDomainAdHistoryByDate, operationId: null, rowsReturned: Multiple, cpm: 3.00, note: "Shipped 2026-07-15; not present in the OpenAPI captured in this repo."}
      - {path: /cloud_ad_history_api/v2/term/getTermAdHistory, operationId: AdHistoryApi_GetTermAdHistory_GET, rowsReturned: Multiple, cpm: 3.00}
      - {path: /cloud_ad_history_api/v2/term/getTermAdHistoryWithStats, operationId: AdHistoryApi_GetTermAdHistoryWithStats_GET, rowsReturned: Multiple, cpm: 3.00}
  - api: PPC Research API
    endpoints:
      - {path: /serp_api/v2/ppc/getPaidSerps, operationId: PaidSerpApi_GetPaidSerps_GET, rowsReturned: "Single/Multiple*", cpm: 2.00}
      - {path: /keyword_api/v2/ppc/getMostSuccessful, operationId: PaidSerpApi_GetMostSuccessful_GET, rowsReturned: "Single/Multiple*", cpm: 2.00}
      - {path: /keyword_api/v2/ppc/getNewKeywords, operationId: PaidSerpApi_GetNewKeywords_GET, rowsReturned: "Single/Multiple*", cpm: 2.00}
  - api: SEO Research API
    endpoints:
      - {path: /serp_api/v2/seo/getSeoKeywords, operationId: OrganicSerpApi_GetSeoKeywords_GET, rowsReturned: "Single/Multiple*", cpm: 0.50}
      - {path: /serp_api/v2/seo/getMostValuableKeywords, operationId: OrganicSerpApi_GetMostValuableKeywords_GET, rowsReturned: "Single/Multiple*", cpm: 0.50}
      - {path: /serp_api/v2/seo/getNewlyRankedKeywords, operationId: OrganicSerpApi_GetNewlyRankedKeywords_GET, rowsReturned: "Single/Multiple*", cpm: 0.50}
      - {path: /serp_api/v2/seo/getGainedRanksKeywords, operationId: OrganicSerpApi_GetGainedRanksKeywords_GET, rowsReturned: "Single/Multiple*", cpm: 0.50}
      - {path: /serp_api/v2/seo/getLostRanksKeywords, operationId: OrganicSerpApi_GetLostRanksKeywords_GET, rowsReturned: "Single/Multiple*", cpm: 0.50}
      - {path: /serp_api/v2/seo/getGainedClicksKeywords, operationId: OrganicSerpApi_GetGainedClicksKeywords_GET, rowsReturned: "Single/Multiple*", cpm: 0.50}
      - {path: /serp_api/v2/seo/getLostClicksKeywords, operationId: OrganicSerpApi_GetLostClicksKeywords_GET, rowsReturned: "Single/Multiple*", cpm: 0.50}
      - {path: /serp_api/v2/seo/getJustMadeItKeywords, operationId: OrganicSerpApi_GetJustMadeItKeywords_GET, rowsReturned: "Single/Multiple*", cpm: 0.50}
      - {path: /serp_api/v2/seo/getJustFellOffKeywords, operationId: OrganicSerpApi_GetJustFellOffKeywords_GET, rowsReturned: "Single/Multiple*", cpm: 0.50}
      - {path: /serp_api/v2/seo/getSerpAnalysisKeywords, operationId: OrganicSerpApi_GetSerpAnalysisKeywords_GET, rowsReturned: "Single/Multiple*", cpm: 0.50}
      - {path: /serp_api/v2/seo/getWhereTheyOutRankYou, operationId: OrganicSerpApi_GetKeywordsWhereTheyOutRankYou_GET, rowsReturned: "Single/Multiple*", cpm: 2.00}
      - {path: /serp_api/v2/seo/getWhereTheyJustSurpassedYou, operationId: OrganicSerpApi_GetKeywordsWhereTheyJustSurpassedYou_GET, rowsReturned: "Single/Multiple*", cpm: 2.00}
      - {path: /serp_api/v2/seo/getLiveSeoStats, operationId: OrganicSerpApi_GetLiveSeoStats_GET, rowsReturned: Single, cpm: 1.00}
      - {path: /serp_api/v2/seo/getMostTrafficTopPages, operationId: TopPagesApi_GetMostTrafficTopPages_GET, rowsReturned: "Single/Multiple*", cpm: 5.00}
      - {path: /serp_api/v2/seo/getNewTopPages, operationId: TopPagesApi_GetNewTopPages_GET, rowsReturned: "Single/Multiple*", cpm: 5.00}
