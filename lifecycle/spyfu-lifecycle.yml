description: >-
  Versioning, deprecation and operational-transparency posture for the SpyFu
  APIs. SpyFu versions in the URI path and is currently on v2 across every
  research service. What it does not publish is the operational half: there is
  no status page, no incident history, no SLA, no deprecation policy, and no
  Sunset/Deprecation header support. A v1 surface is still alive for the free My
  SpyFu project-management API, with no stated end-of-life.
versioning:
  scheme: uri-path
  current: v2
  form: https://api.spyfu.com/apis/{service}/v2/{operation}
  docs: https://developer.spyfu.com/
  services:
    - {service: accounts_api, base: https://api.spyfu.com/apis/accounts_api}
    - {service: domain_stats_api, base: https://api.spyfu.com/apis/domain_stats_api}
    - {service: cloud_ad_history_api, base: https://api.spyfu.com/apis/cloud_ad_history_api}
    - {service: serp_api, base: https://api.spyfu.com/apis/serp_api}
    - {service: keyword_api, base: https://api.spyfu.com/apis/keyword_api}
    - {service: competitors_api, base: https://api.spyfu.com/apis/competitors_api}
    - {service: organic_history_api, base: https://api.spyfu.com/apis/organic_history_api}
  legacy_versions:
    - version: v1
      surface: My SpyFu Project Management API
      url: https://www.spyfu.com/api/v1/project-manager
      status: active
      note: >-
        SpyFu's own reference page describes it as "free to use, and part of our
        version 1 API", documented outside the v2 developer portal. No
        end-of-life is stated, and it carries no OpenAPI.
    - version: legacy portal
      surface: spyfu.com/api
      status: superseded
      note: >-
        The internal overview page in spyfu_api_docs states developer.spyfu.com
        was built to replace the existing spyfu.com/api. No migration deadline
        or shutdown date is published.
